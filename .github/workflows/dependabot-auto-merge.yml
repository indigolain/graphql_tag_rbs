name: Dependabot auto-merge

# Approve Dependabot's patch and minor updates and turn on auto-merge for
# them. GitHub merges the PR once the required CI checks on main pass.
# Major updates are left for a manual review.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'indigolain/graphql_tag_rbs'
    runs-on: ubuntu-latest

    steps:
    - name: Fetch Dependabot metadata
      id: metadata
      uses: dependabot/fetch-metadata@v3
    - name: Approve and enable auto-merge
      if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
      env:
        GH_TOKEN: ${{ github.token }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: |
        gh pr review --approve "$PR_URL"
        gh pr merge --auto --merge "$PR_URL"
