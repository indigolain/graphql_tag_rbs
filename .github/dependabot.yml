version: 2
updates:
  # Gems in Gemfile / Gemfile.lock (development and test dependencies).
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      bundler:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Actions used in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
